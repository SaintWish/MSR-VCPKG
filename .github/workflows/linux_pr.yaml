name: Linux PR Compile Check

on:
  pull_request:
    branches:
      - "dev"

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{github.workspace}}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x86-linux

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repsoitory
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install G++ Multilib & 32 bit OpenGL library
        run: |
          sudo dpkg --add-architecture i386
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install -y build-essential g++-11-multilib libgcc-s1:i386 libstdc++6:i386 libatomic1:i386 libgl1-mesa-dev:i386 pkg-config

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3

      - name: Restore artifacts, setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          runVcpkgInstall: false
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/vcpkg_config/**', '**/utils/**']"
      
      - name: Configure CMake
        run: > 
          cmake -B ${{github.workspace}}/build --toolchain ${{github.workspace}}/cmake/LinuxToolchain.cmake -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} --fresh

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --toolchain ${{github.workspace}}/cmake/LinuxToolchain.cmake
